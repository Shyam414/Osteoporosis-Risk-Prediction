<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prediction Result</title>
  <link rel="stylesheet" href="css/result.css" />
  <script src="js/api.js" defer></script>
</head>
<body>
  <!-- Navbar -->
  <header id="navbar"></header>

  <main class="container">
    <!-- Status / Error Message -->
    <p id="result-message" class="result-message"></p>

    <!-- Prediction Section -->
    <section id="result" class="result-box"></section>

    <!-- History Section -->
    <section class="history-section">
      <h1>Previous Predictions</h1>
      <div id="history" class="history-grid"></div>
    </section>
  </main>

  <script type="module">
    const token = localStorage.getItem("access_token");

    // AUTH GUARD
    if (!token) {
      window.location.href = "login.html";
    }

    const messageEl = document.getElementById("result-message");

    async function initPage() {
      try {
        // Load navbar
        const navbarHTML = await fetch("_navbar.html").then(r => r.text());
        document.getElementById("navbar").innerHTML = navbarHTML;

        // Logout
        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", () => {
            localStorage.removeItem("access_token");
            window.location.href = "index.html";
          });
        }

        const token = localStorage.getItem("access_token");
        if (!token) {
          messageEl.style.color = "red";
          messageEl.textContent = "Session expired. Please login again.";
          setTimeout(() => (window.location.href = "login.html"), 1200);
          return;
        }

        // Load latest prediction
        const params = new URLSearchParams(window.location.search);
        const file_id = params.get("file_id");

        if (file_id) {
          const res = await fetch(`${API_BASE}/predict/file/${file_id}/meta`, {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!res.ok) throw new Error("Failed to load prediction");

          const data = await res.json();

          const imgRes = await fetch(`${API_BASE}/predict/file/${file_id}`, {
            headers: { Authorization: `Bearer ${token}` },
          });

          const imgUrl = imgRes.ok
            ? URL.createObjectURL(await imgRes.blob())
            : "placeholder.png";

          document.getElementById("result").innerHTML = `
            <h2>Prediction Result</h2>
            <div class="prediction-content">
              <img src="${imgUrl}" alt="X-ray" class="prediction-img" />
              <div class="prediction-info">
                <p class="filename">${data.filename}</p>
                <p class="prediction">
                  <strong>${data.prediction}</strong>
                  <span>(${data.probability}%)</span>
                </p>
                <div class="probability-container">
                  <div class="probability-fill ${
                    data.prediction === "Positive" ? "positive" : "negative"
                  }" style="width:${data.probability}%;">
                    ${data.probability}%
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // Load history
        const historyData = await getDashboard();
        const historySection = document.getElementById("history");

        if (historyData.records && historyData.records.length) {
          const cards = await Promise.all(
            historyData.records.map(async (rec) => {
              const imgRes = await fetch(`${API_BASE}/predict/file/${rec.file_id}`, {
                headers: { Authorization: `Bearer ${token}` },
              });

              const imgUrl = imgRes.ok
                ? URL.createObjectURL(await imgRes.blob())
                : "placeholder.png";

              return `
                <div class="card">
                  <img src="${imgUrl}" alt="X-ray" />
                  <p class="filename">${rec.filename}</p>
                  <p class="prediction">
                    ${rec.prediction} (${rec.probability}%)
                  </p>
                </div>
              `;
            })
          );
          historySection.innerHTML = cards.join("");
        } else {
          historySection.innerHTML = '<p class="empty">No history yet.</p>';
        }

      } catch (err) {
        messageEl.style.color = "red";
        messageEl.textContent = err.message || "Failed to load results.";
      }
    }

    initPage();
  </script>
</body>
</html>
