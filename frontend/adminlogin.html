<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="css/login.css" />
  <script src="js/api.js"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <h2>Admin Login</h2>
      <p class="subtitle">Restricted access</p>

      <form id="admin-login-form">
        <label>Email</label>
        <input type="email" id="email" required />

        <label>Password</label>
        <input type="password" id="password" required />

        <button type="submit">Login as Admin</button>

        <p id="admin-message" class="login-message"></p>
      </form>

      <div class="links">
        <span>•</span>
        <a href="login.html">Back to User Login</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("admin-login-form");
    const messageEl = document.getElementById("admin-message");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      messageEl.textContent = "";
      messageEl.style.color = "red";

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;

      // 1️ Normal login
      const res = await login(email, password);

      if (!res.ok || !res.access_token) {
        messageEl.textContent = res.msg || "Login failed";
        return;
      }

      // Save token
      localStorage.setItem("access_token", res.access_token);
      localStorage.setItem("role", res.role);

      // 2️ Already admin
      if (res.role === "admin") {
        messageEl.style.color = "green";
        messageEl.textContent = "Admin login successful";

        setTimeout(() => {
          window.location.href = "admin.html";
        }, 800);
        return;
      }

      // 3Try admin bootstrap
      const bootstrapRes = await fetch(`${API_BASE}/admin/bootstrap`, {
        method: "POST",
        headers: {
          Authorization: `Bearer ${res.access_token}`
        }
      });

      const data = await bootstrapRes.json();

      if (bootstrapRes.ok) {
        messageEl.style.color = "green";
        messageEl.textContent = "Admin created successfully. Please login again.";

        localStorage.clear();

        setTimeout(() => {
          window.location.href = "adminlogin.html";
        }, 1200);
        return;
      }

      messageEl.textContent = data.msg || "Not an admin account";
    });
</script>



</body>
</html>
