<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/login.css" />
  <script src="js/api.js" defer></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container">
      <h2>Reset Password</h2>
      <p class="subtitle">Enter your new password below</p>

      <form id="reset-form">
        <label for="password">New Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your new password"
          required
        />

        <button type="submit">Reset Password</button>

        <p id="reset-message" class="login-message"></p>
      </form>

      <div class="links">
        <span>•</span>
        <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const form = document.getElementById("reset-form");
    const messageEl = document.getElementById("reset-message");
    const button = form.querySelector("button");

    //  Missing token
    if (!token) {
      messageEl.style.color = "red";
      messageEl.textContent = "Reset link is invalid or expired.";
      button.disabled = true;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      messageEl.textContent = "";
      messageEl.style.color = "red";

      const password = form.password.value;

      // use API function
      const res = await resetPassword(token, password);

      // SUCCESS
      if (res.ok) {
        messageEl.style.color = "green";
        messageEl.textContent =
          res.msg || "Password reset successful. Redirecting to login...";

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);
        return;
      }

      // ERROR
      messageEl.textContent = res.msg || "Failed to reset password";
    });
  </script>
</body>
</html>
