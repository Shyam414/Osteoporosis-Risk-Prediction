<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="js/api.js"></script>
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <h1>Dashboard</h1>
    <section id="history"></section>
  </main>

  <!-- NORMAL SCRIPT (NOT MODULE) -->
  <script>
    const token = localStorage.getItem("access_token");

    // AUTH GUARD
    if (!token) {
      window.location.href = "login.html";
    }

    // Load navbar
    fetch("_navbar.html")
      .then(r => r.text())
      .then(html => {
        document.getElementById("navbar").innerHTML = html;

        const logoutBtn = document.getElementById("logout-btn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", () => {
            localStorage.clear();
            window.location.href = "login.html";
          });
        }
      });

    // Load dashboard records
    async function loadDashboard() {
      try {
        const data = await getDashboard();
        const section = document.getElementById("history");

        if (data.records && data.records.length) {
          const cards = await Promise.all(
            data.records.map(async (rec) => {
              const res = await fetch(
                `${API_BASE}/predict/file/${rec.file_id}`,
                {
                  headers: {
                    Authorization: `Bearer ${token}`,
                  },
                }
              );

              const imgUrl = res.ok
                ? URL.createObjectURL(await res.blob())
                : "placeholder.png";

              return `
                <div class="card">
                  <img src="${imgUrl}" alt="X-ray">
                  <p>${rec.filename} - ${rec.prediction}</p>
                  <div class="probability-container">
                    <div class="probability-fill ${
                      rec.prediction.toLowerCase() === "positive"
                        ? "positive"
                        : "negative"
                    }" style="width:${rec.probability}%;">
                      ${rec.probability}%
                    </div>
                  </div>
                </div>
              `;
            })
          );

          section.innerHTML = cards.join("");
        } else {
          section.innerHTML = "<p>No history yet.</p>";
        }
      } catch (err) {
        document.getElementById("history").innerHTML =
          "<p>Error loading dashboard</p>";
      }
    }

    loadDashboard();
  </script>
</body>
</html>
